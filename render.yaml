# Especificación de referencia del servicio de Staging (D-111): hoy el servicio se crea a mano con estos
# mismos valores (ver docs/runbooks/despliegue-y-rollback.md); se usará como Blueprint cuando haya tarjeta.
# Blueprint de Render. Los secretos (sync: false) se cargan en el panel, nunca aquí.
services:
  - type: web
    name: nilogistic-staging
    runtime: docker
    plan: free
    branch: develop
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: ConnectionStrings__Nilogistic
        sync: false
      - key: Supabase__ReferenciaProyecto
        sync: false
      # Secreto del proveedor Resend (HU-010): se carga en el panel, nunca con valor aqui.
      - key: Resend__ApiKey
        sync: false
      - key: Seguridad__Csp__Modo
        value: Reporte
      - key: Seguridad__IndexacionHabilitada
        value: "false"
      # Spike de proxy (S0, solo Staging). HU-013 la reemplaza por Proxy__Redes.
      - key: Proxy__ConfiarEnCualquierProxy
        value: "true"
