# Solo desarrollo local. Contraseña de ejemplo: no reutilizar fuera de tu máquina.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: desarrollo-local
      POSTGRES_DB: nilogistic_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
