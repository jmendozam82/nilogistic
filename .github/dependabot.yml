version: 2
# Las actualizaciones se integran en develop (GitFlow ligero); main solo recibe releases desde develop.
# Se ignoran las versiones mayores: se evalúan a mano en una HU o ADR. En particular
# FluentAssertions 8+ cambió de licencia (uso comercial de pago); el proyecto se queda en 7.x.
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "ci(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "build(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
