name: ci

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-y-pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Nilogistic.slnx

      - name: Compilar (advertencias como errores, NuGetAudit alto)
        run: dotnet build Nilogistic.slnx --no-restore -c Release

      - name: Pruebas de arquitectura (obligatorio)
        run: dotnet test tests/Nilogistic.Arquitectura.Tests --no-build -c Release

      - name: Pruebas BLL con cobertura
        run: >
          dotnet test tests/Nilogistic.BLL.Tests --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory ./TestResults/bll

      - name: Pruebas de aplicación (API, cabeceras, guardia de entorno)
        run: dotnet test tests/Nilogistic.Aplicacion.Tests --no-build -c Release

      - name: Pruebas DAL (Testcontainers PostgreSQL 17)
        run: dotnet test tests/Nilogistic.DAL.Tests --no-build -c Release

      # Puerta G1 (D-102, D-106): cobertura de BLL >= 70 %. No corre en PR a develop; se exige en PR a main
      # (cierre de Sprint / release), al integrar en main y a demanda con workflow_dispatch.
      - name: Puerta G1 - cobertura de BLL >= 70 %
        if: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: python3 scripts/ci/verificar_cobertura.py --minimo 70 --directorio ./TestResults/bll

      - name: Trazabilidad escenarios Gherkin sin prueba
        run: python3 scripts/trazabilidad/escenarios_sin_prueba.py --hu-dir docs/hu --pruebas tests --sprint todos

      - name: Codificacion UTF-8 sin BOM (DT-2)
        run: python3 scripts/ci/verificar_codificacion.py

      - name: Pruebas de los scripts
        run: python3 -m unittest discover -s scripts/tests -v

  # HU-037 Pase B (SUP-3): informa porque NO es un check requerido de la proteccion de rama (no bloquea el
  # merge); el job si se pone rojo si hay defectos, para no ocultar fallos (invariante HU-006 E3, que prohibe
  # los modificadores de exito condicional en este archivo; ver docs/tareas/HU-037.md seccion 13, punto 7).
  # La aplicacion se levanta en Staging sin base de datos real (SUP-4) y se audita por HTTP local enviando
  # X-Forwarded-Proto (la app confia en el proxy de bucle). El informe de axe queda como artefacto.
  # Pasara a check requerido con D-129 (Jorge).
  accesibilidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://127.0.0.1:5080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      NILOGISTIC_URL_BASE: "http://127.0.0.1:5080"
      ConnectionStrings__Nilogistic: "Host=127.0.0.1;Port=1;Database=postgres;Username=postgres.refpruebas;Password=no-se-usa;Timeout=1"
      Supabase__ReferenciaProyecto: "refpruebas"
      TareasSegundoPlano__Habilitado: "false"
      Correo__ForzarBuzon: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: |
          dotnet restore tests/Nilogistic.Accesibilidad.Tests
          dotnet restore src/Nilogistic.Aplicacion

      - name: Compilar (Release)
        run: |
          dotnet build tests/Nilogistic.Accesibilidad.Tests --no-restore -c Release
          dotnet build src/Nilogistic.Aplicacion --no-restore -c Release

      - name: Cache de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('tests/Nilogistic.Accesibilidad.Tests/Nilogistic.Accesibilidad.Tests.csproj', 'Directory.Packages.props') }}

      - name: Instalar Chromium de Playwright
        run: pwsh tests/Nilogistic.Accesibilidad.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Levantar la aplicación y esperar
        run: |
          set -euo pipefail
          nohup dotnet run --no-build -c Release --project src/Nilogistic.Aplicacion > app.log 2>&1 &
          for intento in $(seq 1 60); do
            if curl -fsS -H "X-Forwarded-Proto: https" "$NILOGISTIC_URL_BASE/api/v1/estado" >/dev/null; then
              echo "OK: la aplicación responde en $NILOGISTIC_URL_BASE"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: la aplicación no respondió a tiempo"
          exit 1

      - name: Pruebas de navegador y axe
        run: dotnet test tests/Nilogistic.Accesibilidad.Tests --no-build -c Release

      - name: Registros de la aplicación
        if: ${{ !cancelled() }}
        run: cat app.log || true

      - name: Subir informe de axe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: axe
          path: TestResults/axe
          if-no-files-found: ignore

  secretos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (binario, sin licencia de acción)
        run: |
          set -euo pipefail
          v=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar nombre y orden de migraciones (D-21)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci/verificar_migraciones.py --directorio supabase/migrations --base "origin/${{ github.base_ref }}"
          else
            python3 scripts/ci/verificar_migraciones.py --directorio supabase/migrations
          fi
      - name: Aplicar migraciones dos veces (idempotencia, psql -1 transaccional)
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          for pasada in 1 2; do
            for f in supabase/migrations/*.sql; do
              psql -h localhost -U postgres -1 -v ON_ERROR_STOP=1 -f "$f" >/dev/null
            done
          done
      - name: Migracion con fallo a mitad no deja cambios parciales (E3)
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE mig_prueba_atomica"
          cat > /tmp/migracion_con_error.sql <<'EOF'
          CREATE TABLE parcial_no_persistida (id integer primary key);
          ESTO_NO_ES_SQL_VALIDO;
          EOF
          set +e
          psql -h localhost -U postgres -d mig_prueba_atomica -1 -v ON_ERROR_STOP=1 -f /tmp/migracion_con_error.sql >/dev/null
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "ERROR: la migracion debio fallar"; exit 1
          fi
          existe=$(psql -h localhost -U postgres -d mig_prueba_atomica -tAc "SELECT count(*) FROM pg_tables WHERE tablename='parcial_no_persistida'")
          if [ "$existe" != "0" ]; then
            echo "ERROR: quedaron cambios parciales tras el fallo"; exit 1
          fi
          echo "OK: rollback total ante error a mitad de migracion"
      - name: Guardia RLS deny-by-default (HU-004 DoD)
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/ci/verificar_rls.sql >/dev/null
          echo "OK: RLS en todas las tablas de negocio, sin acceso anon y public vacio"

  conventional-commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar Conventional Commits del rango (HU-005)
        run: python3 scripts/ci/validar_conventional_commits.py --base origin/main

  desplegar-staging:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: [build-y-pruebas, secretos, sql, conventional-commits]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: despliegue-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Comprobar configuracion del entorno
        env:
          DB_URL: ${{ secrets.DB_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          URL_BASE: ${{ vars.URL_BASE }}
        run: |
          set -euo pipefail
          faltan=""
          [ -n "$DB_URL" ] || faltan="$faltan DB_URL"
          [ -n "$RENDER_DEPLOY_HOOK" ] || faltan="$faltan RENDER_DEPLOY_HOOK"
          [ -n "$URL_BASE" ] || faltan="$faltan URL_BASE"
          if [ -n "$faltan" ]; then
            echo "ERROR: faltan en el entorno staging:$faltan (ver docs/runbooks/despliegue-y-rollback.md)"; exit 1
          fi
      - name: Aplicar migraciones en Staging
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DB_URL"
          supabase db push --db-url "$DB_URL"
      - name: Disparar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RENDER_DEPLOY_HOOK"
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK" >/dev/null
      - name: Verificar salud tras el despliegue
        env:
          URL_BASE: ${{ vars.URL_BASE }}
        run: |
          set -euo pipefail
          sleep 90
          for intento in $(seq 1 40); do
            if ! curl -fsS "$URL_BASE/health/ready" >/dev/null; then
              sleep 15
              continue
            fi
            estado=$(curl -fsS "$URL_BASE/api/v1/estado") || { sleep 15; continue; }
            desplegado=$(echo "$estado" | jq -r '.commit // empty' 2>/dev/null) || desplegado=""
            if [ -z "$desplegado" ]; then
              sleep 15
              continue
            fi
            if [ "$desplegado" = "$GITHUB_SHA" ]; then
              echo "OK: Staging sirve el commit $desplegado"; exit 0
            fi
            git fetch --quiet origin develop
            if git merge-base --is-ancestor "$GITHUB_SHA" "$desplegado"; then
              echo "OK: Staging sirve $desplegado, descendiente de $GITHUB_SHA"; exit 0
            fi
            sleep 15
          done
          echo "ERROR: Staging sirve ${desplegado:-sin commit}, se esperaba $GITHUB_SHA"; exit 1

  desplegar-produccion:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: produccion
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Comprobar configuracion del entorno
        env:
          DB_URL: ${{ secrets.DB_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          URL_BASE: ${{ vars.URL_BASE }}
        run: |
          set -euo pipefail
          faltan=""
          [ -n "$DB_URL" ] || faltan="$faltan DB_URL"
          [ -n "$RENDER_DEPLOY_HOOK" ] || faltan="$faltan RENDER_DEPLOY_HOOK"
          [ -n "$URL_BASE" ] || faltan="$faltan URL_BASE"
          if [ -n "$faltan" ]; then
            echo "ERROR: faltan en el entorno produccion:$faltan (ver docs/runbooks/despliegue-y-rollback.md)"; exit 1
          fi
      - name: Aplicar migraciones en Produccion
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DB_URL"
          supabase db push --db-url "$DB_URL"
      - name: Disparar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          echo "::add-mask::$RENDER_DEPLOY_HOOK"
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X POST "$RENDER_DEPLOY_HOOK" >/dev/null
      - name: Verificar salud tras el despliegue
        env:
          URL_BASE: ${{ vars.URL_BASE }}
        run: |
          set -euo pipefail
          sleep 90
          for intento in $(seq 1 40); do
            if ! curl -fsS "$URL_BASE/health/ready" >/dev/null; then
              sleep 15
              continue
            fi
            estado=$(curl -fsS "$URL_BASE/api/v1/estado") || { sleep 15; continue; }
            desplegado=$(echo "$estado" | jq -r '.commit // empty' 2>/dev/null) || desplegado=""
            if [ -z "$desplegado" ]; then
              sleep 15
              continue
            fi
            if [ "$desplegado" = "$GITHUB_SHA" ]; then
              echo "OK: Produccion sirve el commit $desplegado"; exit 0
            fi
            git fetch --quiet origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" "$desplegado"; then
              echo "OK: Produccion sirve $desplegado, descendiente de $GITHUB_SHA"; exit 0
            fi
            sleep 15
          done
          echo "ERROR: Produccion sirve ${desplegado:-sin commit}, se esperaba $GITHUB_SHA"; exit 1
